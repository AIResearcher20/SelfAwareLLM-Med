data:
  source: jsonl
  jsonl_path: data/sample_1000.jsonl
  sample_ids_path: null

model:
  gen_model: llama3.2:3b
  embed_model: nomic-embed-text
  base_url: http://localhost:11434
  timeout_s: 120.0

seed: 13
consistency_temperature: 1.0
evaluation_temperature: 0.7

fixed:
  n_samples: 5

adaptive:
  threshold: 0.85
  min_samples: 4
  max_samples: 5

auas:
  uncertainty_threshold: 0.15
  min_samples: 4
  max_samples: 5
