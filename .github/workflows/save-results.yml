name: save-results

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run ID"
        required: true
      artifact_name:
        description: "Artifact name"
        required: true
        default: "results-jsonl-250"

permissions:
  contents: write
  actions: read

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded

      - name: Copy results
        run: |
          mkdir -p results
          find downloaded -type f -name '*.csv' -exec cp -v {} results/ \;
          find downloaded -type f -name '*.json' -exec cp -v {} results/ \;
          find downloaded -type f -name '*.png' -exec cp -v {} results/ \;
          ls -lah results/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "save results from run ${{ inputs.run_id }}"
          git push
