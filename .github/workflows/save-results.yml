name: save-results

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run ID that produced the artifact"
        required: true
      artifact_name:
        description: "Artifact name to download"
        required: true
        default: "results-jsonl-250"

jobs:
  save:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded

      - name: copy into results
        run: |
          mkdir -p results
          cp downloaded/*.csv results/ 2>/dev/null || true
          cp downloaded/*.json results/ 2>/dev/null || true
          cp downloaded/*.png results/ 2>/dev/null || true
          ls -la results/

      - name: commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "save results from run ${{ inputs.run_id }} (${{ inputs.artifact_name }})"
          git push
